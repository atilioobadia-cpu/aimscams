<div class="app">
  <!-- Full-width header -->
  <header class="header">
    <button class="menu-btn" type="button" aria-label="Open navigation" (click)="drawer.toggle()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>
    </button>
    <div class="header-left">
      <div class="header-brand">
        <div class="header-logo" style="width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 700; flex: none; box-shadow: 0 2px 8px rgba(15, 77, 58, 0.3);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="brand-text">
          <div class="brand-name" style="font-weight: 700; font-size: 16px; letter-spacing: .01em; color: var(--ink);">AIMS CAMS</div>
          <div class="brand-meta" style="display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-faint);">
            <span style="display: inline-flex; align-items: center; gap: 4px; background: var(--brand-soft); color: var(--brand); padding: 2px 8px; border-radius: 999px; font-weight: 600; font-size: 10px;">MFSL MFI</span>
            <span style="display: inline-flex; align-items: center; gap: 4px; background: var(--gold-soft); color: var(--gold); padding: 2px 8px; border-radius: 999px; font-weight: 600; font-size: 10px;">101457</span>
          </div>
        </div>
      </div>
      <div class="header-divider" style="width: 1px; height: 28px; background: var(--border); margin: 0 16px;"></div>
    </div>
    <span class="header-spacer"></span>
    <div class="header-right">
      <div class="header-branch" style="display: flex; align-items: center; gap: 8px; padding: 4px 12px; background: var(--brand-soft); border-radius: 999px; font-size: 11.5px; color: var(--brand); font-weight: 600; white-space: nowrap;">
        <span>{{ branch() }}</span>
        <span style="background: var(--brand); color: #fff; padding: 2px 8px; border-radius: 999px; font-size: 9px; font-weight: 700;">{{ branchStatus() }}</span>
      </div>
      <div class="header-divider" style="width: 1px; height: 24px; background: var(--border); margin: 0 16px;"></div>
      <div class="header-user-menu" style="display: flex; align-items: center; gap: 8px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: #fff;">
        <div class="header-user-avatar" style="width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: none;">AJ</div>
        <div style="font-size: 12px; font-weight: 600; color: var(--ink);">Ally Juma Ally</div>
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" style="color: var(--ink-faint);"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>
  </header>

  <!-- Sidebar + Main content -->
  <aside class="sidebar">
    <aims-sidebar 
      (navItemClick)="onNavItemClick($event)">
    </aims-sidebar>
  </aside>

  <main class="main" [class.expanded]="!sidebarCollapsed()">
    <div class="page">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
