<aside class="sidebar" [class.open]="open()">
  <nav class="sidebar-nav" #navEl id="nav-root" aria-label="Main navigation">
    <!-- Active highlight pill -->
    <span #pillEl class="nav-pill" [class.show]="pillShown()"
      [style.height.px]="pillStyle()?.height ?? 0"
      [style.transform]="pillStyle() ? `translateY(${pillStyle()!.top}px)` : ''"></span>
    <span #ghostEl class="nav-pill ghost" [class.show]="ghostShown()"
      [style.height.px]="ghostStyle()?.height ?? 0"
      [style.transform]="ghostStyle() ? `translateY(${ghostStyle()!.top}px)` : ''"></span>

    <div class="sidebar-nav-list">
      @for (item of NAV; track item.id) {
        @if (item.children) {
          <button class="nav-item nav-toggle"
            [class.soon]="item.soon"
            [class.active]="openGroups().has(item.id)"
            [attr.data-group]="item.id"
            [attr.aria-expanded]="openGroups().has(item.id)"
            [attr.data-label]="item.label"
            [attr.id]="'nav-' + item.id"
            [attr.title]="item.soon ? 'Coming soon' : item.label"
            [disabled]="item.soon"
            (click)="item.soon ? $event.preventDefault() : toggleGroup(item.id)">
            <span class="nav-icon" [innerHTML]="NAVICONS[item.icon ?? ''] | safeHtml"></span>
            <span class="nav-label">{{ item.label }}</span>
            <span class="chev-wrap" style="display: flex !important;">
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 9 6 6 6-6"/></svg>
            </span>
          </button>
          <div class="nav-children" [class.open]="openGroups().has(item.id)">
            <div>
              @for (child of item.children; track child.id) {
                <a class="nav-child" [class.active]="navActive() === child.id" [class.soon]="child.soon"
                  [attr.data-id]="child.id"
                  [attr.href]="child.soon ? null : (child.href ?? null)"
                  [attr.title]="child.soon ? 'Coming soon' : child.label"
                  (click)="onNavChildClick($event, child.id, child.href ?? null, child.soon)">
                  <span class="nav-icon" [innerHTML]="NAVICONS[child.icon ?? ''] | safeHtml"></span>
                  <span class="nav-label">{{ child.label }}</span>
                </a>
              }
            </div>
          </div>
        } @else {
          <a class="nav-item" [class.active]="navActive() === item.id" [class.soon]="item.soon"
            [attr.data-id]="item.id"
            [attr.data-label]="item.label"
            [attr.id]="'nav-' + item.id"
            [attr.href]="item.soon ? null : (item.href ?? null)"
            [attr.title]="item.soon ? 'Coming soon' : item.label"
            (click)="onNavItemClick($event, item.id, item.href ?? null, item.soon)">
            <span class="nav-icon" [innerHTML]="NAVICONS[item.icon ?? ''] | safeHtml"></span>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        }
      }
    </div>
  </nav>

  <div class="sidebar-footer">
    <b>AIMS</b> CAMS · Tanzania<br />
    © 2026 Alpha Integrated Management System
  </div>

  <button class="rail-toggle" type="button"
    [attr.aria-expanded]="!collapsed()"
    [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    [attr.title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    (click)="toggleCollapsed()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
  </button>
</aside>

<div class="rail-scrim" [class.show]="open()" (click)="drawer.toggle()"></div>
