<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard · AIMSCAMS (prototype)</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --brand: #0f4c3a; --brand-deep: #0a3529; --brand-soft: #e7f0ec; --brand-line: #cfe0d8;
    --paper: #f4f6f8; --surface: #fff; --line: #e4e8ea; --line-strong: #d3d9dc;
    --ink: #14201c; --ink-soft: #44524b; --ink-faint: #5c6a63;
    --gold: #b98a2e; --gold-soft: #fbf3e2; --gold-line: #efdfbb;
    --coral: #bf5443; --coral-soft: #fbeeec; --coral-line: #f0d3ce;
    --debit: #1d4b63; --credit: #7a3f22;
    --radius: 10px;
    --mono: "Cascadia Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(20, 32, 28, .05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 Nunito, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: auto minmax(0, 1fr); min-height: 100vh; }

  /* ---------- sidebar (white, smooth sliding indicator) ---------- */
  .rail { width: 280px; flex: none; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; min-width: 0; transition: width .2s ease; }
  .rail-head { display: flex; align-items: center; gap: 9px; padding: 14px 12px; border-bottom: 1px solid var(--line); }
  .rail-head .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
  .rail-head .who { font-size: 12.5px; font-weight: 600; line-height: 1.35; min-width: 0; }
  .rail-head .who span { display: block; font-weight: 400; font-size: 10.5px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand { display: flex; align-items: baseline; gap: 7px; padding: 12px 12px 8px; }
  .brand b { font-size: 15px; letter-spacing: .13em; color: var(--brand); }
  .brand span { font-size: 10.5px; letter-spacing: .2em; color: #7c9a8d; font-weight: 600; }
  nav#nav-root { position: relative; flex: 1; overflow-y: auto; padding: 10px 12px 14px; scrollbar-width: thin; }
  .nav-pill { position: absolute; top: 0; left: 12px; width: calc(100% - 24px); border-radius: 7px; background: var(--brand); box-shadow: inset 3px 0 0 #7fd6ae; z-index: 0; pointer-events: none; opacity: 0; transition: opacity .16s cubic-bezier(.25,.8,.25,1); will-change: opacity; }
  .nav-pill.show { opacity: 1; }
  .nav-pill.ghost { z-index: 0; }
  .nav-section { font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: #7f8d86; padding: 16px 10px 5px; position: relative; z-index: 1; }
  .nav-item { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; padding: 8px 10px; border: 0; background: none; border-radius: 7px; color: #2b332f; font-size: 12.8px; text-align: left; cursor: pointer; text-decoration: none; transition: background .16s ease, color .16s ease; }
  .nav-item > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item svg { width: 16px; height: 16px; flex: 0 0 16px; color: #4f5b55; transition: color .16s ease; }
  .nav-item.active { background: none; color: #fff; font-weight: 700; }
  .nav-item.active svg, .nav-item.active .chev { color: #fff; }
  .nav-item.soon { color: #3c4642; }
  .nav-item.soon.active { color: #fff; }
  .nav-item .chev { margin-left: auto; width: 13px; height: 13px; color: #4f5b55; transition: transform .2s ease; }
  .nav-item[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .nav-item:focus-visible, .nav-child:focus-visible, .rail-toggle:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 7px; }
  .nav-children { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; position: relative; z-index: 1; }
  .nav-children.open { grid-template-rows: 1fr; }
  .nav-children > div { overflow: hidden; }
  .nav-child { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 7px 10px 7px 36px; border-radius: 6px; color: #3b4540; font-size: 12.4px; text-decoration: none; cursor: pointer; transition: background .16s ease, color .16s ease; }
  .nav-child.active { color: #fff; font-weight: 700; }
  .nav-child.soon::after { content: "soon"; margin-left: auto; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: #5f6b65; }
  .nav-child.active::after { color: rgba(255, 255, 255, .82); }
  .rail-foot { border-top: 1px solid var(--line); padding: 10px 12px 12px; font-size: 10px; color: #55625b; line-height: 1.5; }
  .rail-foot b { color: var(--brand); letter-spacing: .1em; }
  .rail-scrim { display: none; }
  .rail-toggle { position: absolute; right: -18px; bottom: 96px; width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 1px solid var(--line-strong); box-shadow: 0 3px 10px rgba(20, 32, 28, .14); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; z-index: 40; color: var(--brand); transition: background .15s ease, color .15s ease, border-color .15s ease; }
  .rail-toggle:hover { background: var(--brand); color: #fff; border-color: var(--brand); }
  .rail-toggle svg { width: 16px; height: 16px; transition: transform .2s ease; }
  .nav-tip { position: fixed; z-index: 90; left: 0; top: 0; background: #10231b; color: #eaf2ed; font-size: 11.5px; font-weight: 600; padding: 5px 9px; border-radius: 6px; white-space: nowrap; pointer-events: none; opacity: 0; transform: translateY(-50%); transition: opacity .12s ease; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }
  .nav-tip.show { opacity: 1; }

  @media (min-width: 901px) {
    body.rail-collapsed .rail { width: 72px; }
    body.rail-collapsed .rail-head { justify-content: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
    body.rail-collapsed .rail-head .who,
    body.rail-collapsed .brand,
    body.rail-collapsed .rail-foot,
    body.rail-collapsed .nav-item > span,
    body.rail-collapsed .nav-item .chev,
    body.rail-collapsed .nav-children { display: none; }
    body.rail-collapsed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
    body.rail-collapsed .rail-toggle svg { transform: rotate(180deg); }
  }

  /* ---------- topbar ---------- */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 60px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 24px; position: sticky; top: 0; z-index: 20; }
  .org { display: flex; align-items: center; gap: 10px; }
  .org .mark { width: 28px; height: 28px; border-radius: 7px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
  .org b { font-size: 13px; font-weight: 600; }
  .org .sub { font-size: 11.5px; color: var(--ink-faint); }
  .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 11.5px; color: var(--ink-soft); background: #fbfcfc; }
  .menu-btn { display: none; width: 34px; height: 34px; border: 1px solid var(--line); background: #fff; border-radius: 8px; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .menu-btn:hover { border-color: var(--brand-line); background: #f3f8f5; }
  .menu-btn svg { width: 18px; height: 18px; color: var(--ink); }
  .back-btn { width: 30px; height: 30px; border: 1px solid transparent; background: transparent; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; color: var(--ink-soft); }
  .back-btn svg { width: 17px; height: 17px; }
  .back-btn:hover:not(:disabled) { background: #e6f1eb; color: var(--brand); }
  .back-btn:disabled { opacity: .35; cursor: default; }
  .spacer { flex: 1; }
  .topbar .lang { border: 0; background: transparent; font-size: 12px; color: var(--ink-soft); }
  .user { display: flex; align-items: center; gap: 9px; padding-left: 14px; border-left: 1px solid var(--line); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: #dfe7e3; color: #2c443a; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .user .who { font-size: 12px; line-height: 1.25; }
  .user .who span { display: block; color: var(--ink-faint); font-size: 10.5px; }
  .org div { min-width: 0; }
  .org b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .proto-tag { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: #8a6d2f; background: var(--gold-soft); border: 1px solid var(--gold-line); padding: 3px 7px; border-radius: 999px; }

  /* ---------- page ---------- */
  .page { padding: 24px 26px 70px; max-width: 1280px; width: 100%; }
  .page-head { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 16px; }
  .page-head h1 { margin: 0 0 3px; font-size: 21px; letter-spacing: -.015em; font-weight: 650; }
  .page-head p { margin: 0; color: var(--ink-faint); font-size: 12.5px; }
  .page-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 6px 11px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: #b8c0bd; background: #fbfcfb; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-deep); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.small { padding: 4px 9px; font-size: 12px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
  .panel-head .sub { font-size: 11.5px; color: var(--ink-faint); }
  .panel-head .right { margin-left: auto; font-size: 11.5px; color: var(--ink-faint); }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 16px; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 13px; font-size: 13px; color: var(--ink-faint); cursor: pointer; }
  .tabs button.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
  .tabs .count { font-size: 10.5px; color: var(--ink-faint); margin-left: 5px; }

  /* ---------- KPIs ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 13px; box-shadow: var(--shadow); position: relative; }
  .kpi .top { display: flex; align-items: flex-start; gap: 10px; }
  .kpi .icon { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; flex: none; }
  .kpi .icon svg { width: 17px; height: 17px; }
  .kpi .icon.green { background: var(--brand-soft); color: var(--brand); }
  .kpi .icon.blue { background: #e8f0f5; color: #1d4b63; }
  .kpi .icon.gold { background: var(--gold-soft); color: #8a6417; }
  .kpi .icon.coral { background: var(--coral-soft); color: #9c4335; }
  .kpi .label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); padding-top: 2px; }
  .kpi .value { font-size: 23px; font-weight: 650; letter-spacing: -.02em; margin-top: 9px; font-variant-numeric: tabular-nums; }
  .kpi .value small { font-size: 12px; font-weight: 500; color: var(--ink-faint); letter-spacing: 0; margin-left: 2px; }
  .kpi .foot { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 11.5px; color: var(--ink-faint); }
  .delta { font-weight: 600; font-size: 11.5px; }
  .delta.up { color: #1c7a52; }
  .delta.down { color: var(--coral); }

  /* ---------- charts ---------- */
  .grid-2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-2.even { grid-template-columns: 1fr 1fr; }
  .chart { padding: 16px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-faint); }
  .legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }
  .bars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 12px; align-items: end; height: 176px; padding: 10px 2px 0; border-bottom: 1px solid var(--line); }
  .bar-col { display: flex; flex-direction: column; height: 100%; justify-content: flex-end; gap: 6px; }
  .bar-pair { display: flex; align-items: end; gap: 3px; height: 100%; }
  .bar { flex: 1; border-radius: 3px 3px 0 0; min-height: 2px; }
  .bar.in { background: var(--brand); opacity: .9; }
  .bar.out { background: #c9b79a; opacity: .95; }
  .bar-col .m { font-size: 10.5px; color: var(--ink-faint); text-align: center; }
  .bar-axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-faint); padding-top: 6px; }

  .donut-wrap { display: flex; align-items: center; gap: 18px; padding: 6px 4px 10px; }
  .donut { flex: none; }
  .donut circle { transition: stroke-dasharray .3s ease; }
  .donut legend-row { display: block; }
  .dlegend { display: grid; gap: 9px; flex: 1; }
  .dlegend .row { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
  .dlegend .row i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .dlegend .row .n { color: var(--ink-soft); }
  .dlegend .row .v { margin-left: auto; font-family: var(--mono); font-size: 11.5px; }
  .dlegend .row .p { color: var(--ink-faint); font-size: 10.5px; width: 38px; text-align: right; }

  .buckets { padding: 6px 16px 14px; }
  .bucket { display: grid; grid-template-columns: 84px 1fr 48px 92px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid #f0f2f2; }
  .bucket:last-child { border-bottom: 0; }
  .bucket .n { font-size: 12px; color: var(--ink-soft); }
  .bucket .track { height: 8px; border-radius: 4px; background: #eef1f1; overflow: hidden; }
  .bucket .track i { display: block; height: 100%; border-radius: 4px; }
  .bucket .c { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .bucket .amt { font-family: var(--mono); font-size: 11.5px; text-align: right; color: var(--ink-faint); }

  .activity { padding: 2px 0; }
  .act { display: flex; align-items: center; gap: 11px; padding: 9px 16px; border-bottom: 1px solid #f0f2f2; }
  .act:last-child { border-bottom: 0; }
  .act .ini { width: 28px; height: 28px; border-radius: 50%; background: #e9eeeb; color: #355043; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; flex: none; }
  .act .who { font-size: 12.5px; }
  .act .what { font-size: 11px; color: var(--ink-faint); }
  .act .amt { margin-left: auto; font-family: var(--mono); font-size: 12px; }
  .act .when { font-size: 11px; color: var(--ink-faint); width: 60px; text-align: right; }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); font-weight: 650; padding: 9px 14px; background: #fbfcfc; border-bottom: 1px solid var(--line); }
  thead th.num { text-align: right; }
  tbody td { padding: 10px 14px; border-bottom: 1px solid #f0f2f2; font-size: 13px; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover td { background: #fbfcfb; }
  td.num { text-align: right; }
  .money { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; }
  .money.dr { color: var(--debit); } .money.cr { color: var(--credit); }
  .muted { color: var(--ink-faint); }

  .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .toolbar input[type="search"], .toolbar select { border: 1px solid var(--line-strong); background: #fff; border-radius: 7px; padding: 6px 9px; font-size: 12.5px; }
  .toolbar input[type="search"] { min-width: 230px; }
  .pager { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-faint); }
  .pager .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }

  .member-cell { display: flex; align-items: center; gap: 10px; }
  .initials { width: 28px; height: 28px; border-radius: 50%; background: #e6ece8; color: #33503f; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; flex: none; }
  .member-cell .no { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
  .member-cell .nm { font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; padding: 3px 7px; border-radius: 999px; }
  .pill.ok { background: #e9f5ef; color: #176b48; border: 1px solid #cfe8db; }
  .pill.warn { background: var(--gold-soft); color: #7d5a13; border: 1px solid var(--gold-line); }
  .pill.bad { background: var(--coral-soft); color: #94402f; border: 1px solid var(--coral-line); }
  .pill.muted { background: #f1f3f2; color: #6b7872; border: 1px solid #e2e6e4; }

  /* ---------- profile ---------- */
  .back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--ink-faint); cursor: pointer; font-size: 12.5px; margin-bottom: 14px; }
  .back:hover { color: var(--ink); }
  .identity { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
  .identity .initials { width: 52px; height: 52px; font-size: 17px; }
  .identity h1 { margin: 0 0 3px; font-size: 21px; font-weight: 650; letter-spacing: -.015em; }
  .identity .meta { color: var(--ink-faint); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }
  .identity .badges { display: flex; gap: 6px; margin-top: 7px; }
  .identity .right { margin-left: auto; display: flex; gap: 8px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; }
  .stat .k { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); }
  .stat .v { font-size: 19px; font-weight: 650; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .stat .s { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; }
  .tab-body { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); background: var(--surface); overflow-x: auto; }
  .account-card { display: flex; gap: 26px; align-items: baseline; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .account-card .big { font-size: 23px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .account-card .lbl { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); }
  .account-card .meta { margin-left: auto; font-size: 11.5px; color: var(--ink-faint); text-align: right; line-height: 1.6; }
  .empty { padding: 26px; text-align: center; color: var(--ink-faint); font-size: 13px; }

  /* ---------- modal / toast ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(10, 24, 18, .45); display: grid; place-items: center; z-index: 80; padding: 20px; }
  .modal { width: 100%; max-width: 470px; background: #fff; border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.26); overflow: hidden; }
  .modal header { padding: 17px 20px 12px; border-bottom: 1px solid var(--line); }
  .modal header h2 { margin: 0 0 3px; font-size: 16px; }
  .modal header p { margin: 0; font-size: 12px; color: var(--ink-faint); }
  .modal .body { padding: 16px 20px; display: grid; gap: 13px; }
  .field label { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 5px; }
  .field input, .field select { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 11px; font-size: 14px; }
  .field input:focus, .field select:focus { outline: 2px solid #cfe4dc; border-color: var(--brand); }
  .chips { display: flex; gap: 6px; margin-top: 7px; }
  .chips button { border: 1px solid var(--line); background: #fbfcfb; border-radius: 999px; padding: 4px 10px; font-size: 11.5px; cursor: pointer; }
  .chips button:hover { border-color: var(--brand); color: var(--brand); }
  .modal footer { padding: 13px 20px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; background: #fbfcfb; }
  .modal footer .hint { font-size: 11.5px; color: var(--ink-faint); }
  .modal footer .right { margin-left: auto; display: flex; gap: 8px; }

<script>
  /* =========================================================
     Synthetic book. Invented records only — no observed tenant data.
     ========================================================= */
  const TODAY = new Date(Date.UTC(2026, 9, 23));
  const DAY = 86400000;
  const iso = (d) => d.toISOString().slice(0, 10);
  const addMonths = (d, n) => new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, Math.min(d.getUTCDate(), 28)));
  const num = (n) => n.toLocaleString('en-US');
  const compact = (n) => {
    if (n >= 1e9) return (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return Math.round(n / 1e3) + 'K';
    return String(n);
  };

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(20261023);
  const pick = (list) => list[Math.floor(rnd() * list.length)];
  const between = (min, max) => min + rnd() * (max - min);
  const roundTo = (n, step) => Math.round(n / step) * step;

  const FIRST = ['Neema','Baraka','Asha','Joseph','Fatuma','Daniel','Grace','Hassan','Rehema','Emmanuel','Zainab','Peter','Halima','David','Mariam','Samuel','Salma','John','Esther','Musa','Anna','Ibrahim','Joyce','Michael','Sophia','Abdallah','Beatrice','Christopher','Zuhura','Elias','Tumaini','Winfrida','Rashid','Clara','Yusuf','Agatha'];
  const LAST = ['Kilonzo','Mushi','Mwakyusa','Mrema','Suleiman','Mwansasu','Kimaro','Mwaipopo','Shayo','Mfinanga','Njau','Msuya','Kessy','Mwamwaja','Chuwa','Lyimo','Mhando','Swai','Temu','Mbwana','Juma','Hamisi','Mwanri','Mkumbo','Nyoni','Mahmoud','Kibona','Mnyika','Sanga','Mwaikambo','Nkya','Bwire','Mgeni','Kilasi','Macha'];
  const BRANCHES = ['Head office', 'Branch 2', 'Branch 3', 'Branch 4'];

  /* ---- loan construction: real annuity, real amortisation ---- */
  function makeLoan(no, product, principal, rate, term, startISO, paidInstallments) {
    const start = new Date(startISO + 'T00:00:00Z');
    const r = rate / 100 / 12;
    const payment = Math.round((principal * r) / (1 - Math.pow(1 + r, -term)));
    const rows = [];
    let balance = principal;
    for (let i = 1; i <= term; i++) {
      const interest = Math.round(balance * r);
      let princ = payment - interest;
      if (i === term) princ = balance;
      balance -= princ;
      rows.push({ n: i, due: iso(addMonths(start, i)), principal: princ, interest, total: princ + interest });
    }
    const dueCount = rows.filter((row) => new Date(row.due + 'T00:00:00Z') < TODAY).length;
    const paid = Math.max(0, Math.min(paidInstallments, dueCount));
    const unpaid = rows.slice(paid);
    const overdue = unpaid.filter((row) => new Date(row.due + 'T00:00:00Z') < TODAY);
    const dpd = overdue.length ? Math.floor((TODAY - new Date(overdue[0].due + 'T00:00:00Z')) / DAY) : 0;
    const outstanding = unpaid.reduce((t, row) => t + row.principal, 0);
    const arrearsAmount = overdue.reduce((t, row) => t + row.total, 0);
    return {
      no, product, principal, outstanding, arrearsAmount, dpd,
      rate, rateLabel: rate + '% p.a. declining', term, termLabel: term + ' months',
      disbursed: startISO, paidCount: paid,
      nextDue: unpaid[0] ? unpaid[0].due : null,
      nextAmount: unpaid[0] ? unpaid[0].total : 0,
      status: dpd > 0 ? 'Arrears' : 'Current',
      schedule: unpaid.slice(0, 4).map((row, i) => ({
        n: row.n, due: row.due, principal: row.principal, interest: row.interest,
        total: row.total, state: dpd > 0 && i === 0 ? 'Overdue' : 'Scheduled',
      })),
      paid: rows.slice(Math.max(0, paid - 3), paid).reverse().map((row) => ({
        n: row.n, due: row.due, paid: row.due, amount: row.total, state: 'Paid',
      })),
    };
  }

  function makeTransactions(member, count) {
    const methods = ['Cash', 'Bank', 'Mobile money'];
    let balance = member.savings;
    const rows = [];
    let offset = 3 + Math.floor(rnd() * 10);
    for (let i = 0; i < count; i++) {
      const deposit = rnd() < 0.76;
      const share = between(0.05, 0.22);
      const amount = Math.max(10000, roundTo(balance * share, 5000));
      const before = deposit ? balance - amount : balance + amount;
      rows.push({
        date: iso(new Date(TODAY - offset * DAY)),
        type: deposit ? 'Deposit' : 'Withdrawal',
        method: pick(methods),
        amount,
        balance,
        ref: 'RCP-' + (2100 + Math.floor(rnd() * 400)),
      });
      balance = Math.max(0, before);
      offset += 11 + Math.floor(rnd() * 22);
    }
    return rows;
  }

  const MEMBERS = [];
  const seen = new Set();

  function addMember(m) {
    if (!m.transactions) m.transactions = makeTransactions(m, 1 + Math.floor(rnd() * 3));
    MEMBERS.push(m);
  }

  /* six curated members — used for the walkthrough */
  addMember({ id: 'M-0001', first: 'Neema', last: 'Kilonzo', phone: '+255 754 000 101', branch: 'Head office', joined: '2023-02-14', status: 'Active', kyc: 'Verified', membership: 'Ordinary', savings: 1250000, shares: 200000, savingsNo: 'SAV-0001',
    loan: makeLoan('LN-0042', 'Business loan', 3000000, 24, 12, '2026-03-15', 7) });
  addMember({ id: 'M-0002', first: 'Baraka', last: 'Mushi', phone: '+255 762 000 214', branch: 'Head office', joined: '2023-06-02', status: 'Active', kyc: 'Verified', membership: 'Ordinary', savings: 640000, shares: 150000, savingsNo: 'SAV-0002', loan: null });
  addMember({ id: 'M-0003', first: 'Asha', last: 'Mwakyusa', phone: '+255 786 000 337', branch: 'Head office', joined: '2024-01-19', status: 'Active', kyc: 'Pending', membership: 'Ordinary', savings: 320000, shares: 50000, savingsNo: 'SAV-0003', loan: null });
  addMember({ id: 'M-0004', first: 'Joseph', last: 'Mrema', phone: '+255 715 000 458', branch: 'Head office', joined: '2022-11-08', status: 'Dormant', kyc: 'Verified', membership: 'Ordinary', savings: 85000, shares: 100000, savingsNo: 'SAV-0004', loan: null });
  addMember({ id: 'M-0005', first: 'Fatuma', last: 'Suleiman', phone: '+255 784 000 562', branch: 'Branch 2', joined: '2024-08-27', status: 'Active', kyc: 'Verified', membership: 'Group', savings: 2100000, shares: 400000, savingsNo: 'SAV-0005',
    loan: makeLoan('LN-0051', 'Agriculture loan', 5000000, 21, 18, '2026-05-05', 6) });
  addMember({ id: 'M-0006', first: 'Daniel', last: 'Mwansasu', phone: '+255 768 000 671', branch: 'Branch 2', joined: '2025-04-03', status: 'Active', kyc: 'Rejected', membership: 'Ordinary', savings: 15000, shares: 0, savingsNo: 'SAV-0006', loan: null });

  /* generated register up to 248 members */
  for (let i = 7; i <= 248; i++) {
    let first, last, key;
    do { first = pick(FIRST); last = pick(LAST); key = first + ' ' + last; } while (seen.has(key));
    seen.add(key);
    const joined = new Date(TODAY - Math.floor(between(2, 720)) * DAY);
    const savings = Math.max(15000, roundTo(between(20000, 2800000), 1000));
    const shares = rnd() < 0.18 ? 0 : roundTo(between(50000, 600000), 50000);
    const status = rnd() < 0.86 ? 'Active' : 'Dormant';
    const kyc = rnd() < 0.82 ? 'Verified' : rnd() < 0.6 ? 'Pending' : 'Rejected';
    const membership = rnd() < 0.12 ? 'Group' : 'Ordinary';
    let loan = null;
    if (rnd() < 0.34) {
      const principal = roundTo(between(500000, 8000000), 100000);
      const rate = pick([18, 20, 21, 22, 24, 26]);
      const term = pick([6, 12, 18, 24]);
      const startMonthsAgo = 3 + Math.floor(rnd() * 17);
      const start = addMonths(TODAY, -startMonthsAgo);
      const dueMonths = startMonthsAgo;
      const late = rnd() < 0.62 ? Math.floor(between(0, 4)) : 0;
      const paid = Math.max(0, Math.min(dueMonths, dueMonths - late));
      loan = makeLoan('LN-' + String(1000 + i), pick(['Business loan', 'Agriculture loan', 'Salary loan', 'Group loan']), principal, rate, term, iso(start), paid);
    }
    MEMBERS.push({
      id: 'M-' + String(i).padStart(4, '0'),
      first, last,
      phone: '+255 7' + String(10 + Math.floor(rnd() * 80)) + ' ' + String(100 + Math.floor(rnd() * 900)) + ' ' + String(100 + Math.floor(rnd() * 900)),
      branch: pick(BRANCHES),
      joined: iso(joined), status, kyc, membership, savings, shares,
      savingsNo: 'SAV-' + String(i).padStart(4, '0'),
      loan,
      transactions: makeTransactions({ savings }, 1 + Math.floor(rnd() * 3)),
    });
  }

  /* ---- curated history for the walkthrough members ---- */
  MEMBERS[0].transactions = [
    { date: '2026-10-19', type: 'Deposit', method: 'Cash', amount: 150000, balance: 1250000, ref: 'RCP-2419' },
    { date: '2026-10-05', type: 'Deposit', method: 'Mobile money', amount: 300000, balance: 1100000, ref: 'RCP-2381' },
    { date: '2026-09-28', type: 'Withdrawal', method: 'Cash', amount: 50000, balance: 800000, ref: 'RCP-2302' },
    { date: '2026-09-15', type: 'Deposit', method: 'Bank', amount: 250000, balance: 850000, ref: 'RCP-2244' },
  ];
  MEMBERS[1].transactions = [
    { date: '2026-10-12', type: 'Deposit', method: 'Cash', amount: 90000, balance: 640000, ref: 'RCP-2405' },
    { date: '2026-09-20', type: 'Deposit', method: 'Cash', amount: 120000, balance: 550000, ref: 'RCP-2298' },
  ];
  MEMBERS[2].transactions = [
    { date: '2026-10-09', type: 'Deposit', method: 'Mobile money', amount: 70000, balance: 320000, ref: 'RCP-2394' },
  ];
  MEMBERS[3].transactions = [
    { date: '2026-03-11', type: 'Withdrawal', method: 'Cash', amount: 40000, balance: 85000, ref: 'RCP-1980' },
  ];
  MEMBERS[4].transactions = [
    { date: '2026-10-21', type: 'Deposit', method: 'Bank', amount: 400000, balance: 2100000, ref: 'RCP-2427' },
    { date: '2026-10-01', type: 'Deposit', method: 'Bank', amount: 350000, balance: 1700000, ref: 'RCP-2350' },
  ];
  MEMBERS[5].transactions = [];

  /* ---- portfolio maths ---- */
  const sum = (list, get) => list.reduce((t, item) => t + (get ? get(item) : item), 0);
  const loans = () => MEMBERS.filter((m) => m.loan);
  const portfolio = () => {
    const savings = sum(MEMBERS, (m) => m.savings);
    const shares = sum(MEMBERS, (m) => m.shares);
    const outstanding = sum(loans(), (m) => m.loan.outstanding);
    const arrears = sum(loans(), (m) => m.loan.arrearsAmount);
    const inArrears = loans().filter((m) => m.loan.dpd > 0);
    return {
      members: MEMBERS.length,
      active: MEMBERS.filter((m) => m.status === 'Active').length,
      kycPending: MEMBERS.filter((m) => m.kyc === 'Pending').length,
      savings, shares, outstanding, arrears,
      clientsInArrears: inArrears.length,
      par: outstanding ? (arrears / outstanding) * 100 : 0,
    };
  };

  const buckets = () => {
    const defs = [
      { label: 'Current', test: (d) => d === 0, color: '#2f8a63' },
      { label: '1–30 days', test: (d) => d > 0 && d <= 30, color: '#b98a2e' },
      { label: '31–60 days', test: (d) => d > 30 && d <= 60, color: '#c47b45' },
      { label: '61–90 days', test: (d) => d > 60 && d <= 90, color: '#bf5443' },
      { label: '90+ days', test: (d) => d > 90, color: '#8f3428' },
    ];
    return defs.map((d) => {
      const rows = loans().filter((m) => d.test(m.loan.dpd));
      return { ...d, count: rows.length, amount: sum(rows, (m) => m.loan.arrearsAmount || m.loan.outstanding) };
    });
  };

  const monthKey = (d) => d.slice(0, 7);
  const monthLabel = (d) => new Date(d + '-02T00:00:00Z').toLocaleString('en-US', { month: 'short' });
  const lastMonths = (n) => {
    const out = [];
    for (let i = n - 1; i >= 0; i--) out.push(iso(addMonths(TODAY, -i)).slice(0, 7));
    return out;
  };
  const fundsFlow = () => {
    const months = lastMonths(6);
    const all = MEMBERS.flatMap((m) => m.transactions);
    return {
      labels: months.map(monthLabel),
      in: months.map((k) => sum(all.filter((t) => monthKey(t.date) === k && t.type === 'Deposit'), (t) => t.amount)),
      out: months.map((k) => sum(all.filter((t) => monthKey(t.date) === k && t.type === 'Withdrawal'), (t) => t.amount)),
    };
  };

  /* =========================================================
     Rendering
     ========================================================= */
  let state = {
    route: 'dashboard', tab: 'overview', memberTab: 'savings',
    query: '', branch: 'All branches', status: 'All statuses', page: 1, pageSize: 20,
  };
  const $ = (sel) => document.querySelector(sel);
  const memberById = (id) => MEMBERS.find((m) => m.id === id);
  const initials = (m) => m.first[0] + m.last[0];
  const pill = (text, tone) => '<span class="pill ' + tone + '">' + text + '</span>';
  const statusPill = (s) => pill(s, s === 'Active' ? 'ok' : s === 'Dormant' ? 'muted' : 'warn');
  const kycPill = (k) => pill('KYC ' + k, k === 'Verified' ? 'ok' : k === 'Pending' ? 'warn' : 'bad');

  function route() {
    const hash = location.hash || '#/dashboard';
    if (hash.startsWith('#/members/')) return { name: 'profile', id: hash.slice('#/members/'.length) };
    if (hash.startsWith('#/members')) return { name: 'members' };
    return { name: 'dashboard' };
  }

  const NAV = [
    { id: 'dashboard', label: 'Dashboard', href: '#/dashboard', icon: 'grid' },
    { id: 'members', label: 'Members', href: '#/members', icon: 'users' },
    { id: 'accounts', label: 'Accounts', soon: true, icon: 'wallet' },
    { id: 'applications', label: 'Applications', soon: true, icon: 'inbox' },
    { id: 'loans', label: 'Loans', soon: true, icon: 'file' },
    { id: 'savings', label: 'Savings', soon: true, icon: 'coin' },
    { id: 'transactions', label: 'Transactions', soon: true, icon: 'swap' },
    { id: 'teller', label: 'Teller', soon: true, icon: 'cash' },
    { id: 'accounting', label: 'Accounting', icon: 'book', children: [
        { id: 'coa', label: 'Chart of Accounts' },
        { id: 'entries', label: 'Entries' },
        { id: 'ledger-entries', label: 'Ledger Entries' },
        { id: 'asset-types', label: 'Asset Types' },
        { id: 'fixed-asset', label: 'Fixed Asset' }
      ] },
    { id: 'requests', label: 'Requests', soon: true, icon: 'bell' },
    { id: 'messages', label: 'Messages', soon: true, icon: 'message' },
    { id: 'campaigns', label: 'Campaigns', icon: 'megaphone', children: [
        { id: 'run-campaign', label: 'Run Campaign' },
        { id: 'active-campaigns', label: 'Active Campaigns' }
      ] },
    { id: 'reports', label: 'Reports', icon: 'chart', children: [
        { id: 'rep-loan', label: 'Loan' },
        { id: 'rep-savings', label: 'Savings' },
        { id: 'rep-tx', label: 'Transactions' },
        { id: 'rep-client', label: 'Client' },
        { id: 'rep-msp', label: 'MSP' },
        { id: 'rep-statement', label: 'Statement' }
      ] },
    { id: 'import', label: 'Import', icon: 'upload', children: [
        { id: 'imp-member', label: 'Member' },
        { id: 'imp-account', label: 'Account' },
        { id: 'imp-transaction', label: 'Transaction' }
      ] },
    { id: 'business', label: 'Business Account', soon: true, icon: 'briefcase' },
    { id: 'settings', label: 'Settings', icon: 'gear', children: [
        { id: 'gen', label: 'General' },
        { id: 'acc-settings', label: 'Accounting' },
        { id: 'branches', label: 'Branches' },
        { id: 'products', label: 'Products' },
        { id: 'policies', label: 'Policies' },
        { id: 'users', label: 'Users' },
        { id: 'roles', label: 'Roles' },
        { id: 'services', label: 'Services' }
      ] }
  ];

  state.navActive = 'dashboard';
  state.openGroups = new Set();

  function markActive(id) {
    const nav = document.getElementById('nav-root');
    if (!nav) return;
    nav.querySelectorAll('.nav-item.active, .nav-child.active').forEach((el) => {
      el.classList.remove('active');
      el.removeAttribute('aria-current');
    });
    if (!id) return;
    const target = nav.querySelector('.nav-item[data-id="' + id + '"], .nav-child[data-id="' + id + '"]');
    if (target) {
      target.classList.add('active');
      target.setAttribute('aria-current', 'page');
    }
  }

  function renderNav() {
    const nav = document.getElementById('nav-root');
    if (!nav) return;
    const sig = [...state.openGroups].sort().join(',');
    if (nav.dataset.sig === sig && document.getElementById('nav-pill')) {
      markActive(state.navActive);
      requestAnimationFrame(() => movePill(false));
      return;
    }

    const scrollPos = nav.scrollTop;
    const pill = document.getElementById('nav-pill');
    const ghost = document.getElementById('nav-pill-ghost');
    let html = '';
    for (const item of NAV) {
      if (item.children) {
        const open = state.openGroups.has(item.id);
        html += `<button class="nav-item nav-toggle" type="button" aria-expanded="${open}" data-group="${item.id}" data-label="${item.label}" onclick="toggleGroup('${item.id}')" id="nav-${item.id}">`;
        html += (NAVICONS[item.icon] || '');
        html += `<span>${item.label}</span>${NAVICONS.chev}</button>`;
        html += `<div class="nav-children ${open ? 'open' : ''}" data-children-for="${item.id}"><div>`;
        for (const child of item.children) {
          const active = state.navActive === child.id ? ' active' : '';
          const soon = child.soon ? ' soon' : '';
          html += `<a class="nav-child${active}${soon}" data-id="${child.id}" href="#" onclick="navClick('${child.id}', null, '${child.label.replace(/'/g, "\\'")}', ${!!child.soon}); return false;">${child.label}</a>`;
        }
        html += `</div></div>`;
      } else {
        const active = state.navActive === item.id ? ' active' : '';
        const soon = item.soon ? ' soon' : '';
        if (item.href && !item.soon) {
          html += `<a class="nav-item${active}${soon}" href="${item.href}" data-id="${item.id}" data-label="${item.label}" id="nav-${item.id}" onclick="navClick('${item.id}', '${item.href}', '${item.label.replace(/'/g, "\\'")}', false); return false;">${(NAVICONS[item.icon] || '')}<span>${item.label}</span></a>`;
        } else {
          html += `<a class="nav-item${active}${soon}" href="#" data-id="${item.id}" data-label="${item.label}" id="nav-${item.id}" onclick="navClick('${item.id}', null, '${item.label.replace(/'/g, "\\'")}', ${!!item.soon}); return false;">${(NAVICONS[item.icon] || '')}<span>${item.label}</span></a>`;
        }
      }
    }
    nav.innerHTML = html;
    nav.dataset.sig = sig;
    if (ghost) {
      nav.insertBefore(ghost, nav.firstChild);
    } else {
      const g = document.createElement('span');
      g.className = 'nav-pill ghost';
      g.id = 'nav-pill-ghost';
      nav.insertBefore(g, nav.firstChild);
    }
    if (pill) {
      const afterGhost = document.getElementById('nav-pill-ghost');
      if (afterGhost && afterGhost.nextSibling) nav.insertBefore(pill, afterGhost.nextSibling);
      else if (afterGhost) nav.appendChild(pill);
      else nav.insertBefore(pill, nav.firstChild);
    } else {
      const p = document.createElement('span');
      p.className = 'nav-pill';
      p.id = 'nav-pill';
      nav.insertBefore(p, document.getElementById('nav-pill-ghost') ? document.getElementById('nav-pill-ghost').nextSibling : nav.firstChild);
    }
    nav.scrollTop = scrollPos;
    markActive(state.navActive);
    requestAnimationFrame(() => movePill(true));
  }

  let pillTimer = 0;
  function movePill(instant) {
    const pill = document.getElementById('nav-pill');
    const ghost = document.getElementById('nav-pill-ghost');
    const nav = document.getElementById('nav-root');
    if (!pill || !nav) return;

    const active = nav.querySelector('.nav-item.active, .nav-child.active');
    const hideAll = () => {
      pill.classList.remove('show');
      if (ghost) ghost.classList.remove('show');
      pill.removeAttribute('data-key');
    };
    if (!active) { hideAll(); return; }
    const group = active.closest('.nav-children');
    if (group && !group.classList.contains('open')) { hideAll(); return; }

    const rect = active.getBoundingClientRect();
    if (rect.height < 6) { hideAll(); return; }
    const navRect = nav.getBoundingClientRect();
    const top = rect.top - navRect.top + nav.scrollTop;
    const height = rect.height;
    const key = top.toFixed(1) + ':' + height.toFixed(1);

    const setGeom = (el) => {
      el.style.transition = 'none';
      el.style.height = height + 'px';
      el.style.transform = 'translateY(' + top + 'px)';
    };

    if (instant) {
      if (ghost) ghost.classList.remove('show');
      setGeom(pill);
      pill.classList.add('show');
      void pill.offsetHeight;
      pill.style.transition = '';
      pill.dataset.key = key;
      return;
    }

    const same = pill.dataset.key === key;
    const wasShown = pill.classList.contains('show');
    if (same) {
      if (!wasShown) {
        setGeom(pill);
        pill.classList.add('show');
        void pill.offsetHeight;
        pill.style.transition = '';
      }
      pill.dataset.key = key;
      return;
    }

    const op = parseFloat(getComputedStyle(pill).opacity) || 0;
    const doHandoff = wasShown && op > 0.25 && ghost;

    if (doHandoff) {
      ghost.style.transition = 'none';
      ghost.style.height = pill.style.height;
      ghost.style.transform = pill.style.transform;
      ghost.classList.add('show');
      void ghost.offsetHeight;
      ghost.style.transition = '';
    }

    pill.style.transition = 'none';
    pill.classList.remove('show');
    setGeom(pill);
    void pill.offsetHeight;
    pill.style.transition = '';
    pill.dataset.key = key;

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        pill.classList.add('show');
        if (doHandoff && ghost) ghost.classList.remove('show');
      });
    });
  }

  function isRailCollapsed() { return railIsNarrow() && document.body.classList.contains('rail-collapsed'); }

  function setRail(collapsed, persist) {
    document.body.classList.toggle('rail-collapsed', collapsed);
    const btn = document.getElementById('rail-toggle');
    if (btn) {
      btn.setAttribute('aria-expanded', String(!collapsed));
      btn.setAttribute('aria-label', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
      btn.setAttribute('title', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
    }
    if (persist) { try { localStorage.setItem(RAIL_KEY, collapsed ? '1' : '0'); } catch (e) {} }
    hideTip();
    setTimeout(() => movePill(false), 210);
  }

    const tip = document.getElementById('nav-tip');
    if (!tip || !isRailCollapsed()) return;
    const label = item.getAttribute('data-label');
    if (!label) return;
    const r = item.getBoundingClientRect();
    const rail = document.querySelector('.rail').getBoundingClientRect();
    tip.textContent = label;
    tip.style.left = Math.round(Math.max(r.right, rail.right) + 10) + 'px';
    tip.style.top = Math.round(r.top + r.height / 2) + 'px';
    tip.classList.add('show');
  }

  function navClick(id, href, label, soon) {
    state.navActive = id;

    closeMenu();

    } else {
      renderNav();

        showToast('Not built in this prototype', label + ' is part of the next slice shown in the observed layout.');

    const open = typeof force === 'boolean' ? force : !rail.classList.contains('open');
    rail.classList.toggle('open', open);
    scrim.classList.toggle('show', open);
    if (btn) btn.setAttribute('aria-expanded', String(open));

  function barChart(flow) {

  function donut(segments) {
    const total = sum(segments, (s) => s.value) || 1;
    const c = 2 * Math.PI * 46;
    let offset = 0;
    const rings = segments.map((s) => {
      const length = (s.value / total) * c;
      const ring = `<circle cx="60" cy="60" r="46" fill="none" stroke="${s.color}" stroke-width="14"
        stroke-dasharray="${Math.max(0, length - 3)} ${c - Math.max(0, length - 3)}" stroke-dashoffset="${-offset}" />`;
      offset += length;
      return ring;
    }).join('');
    return `<div class="donut-wrap">
      <svg class="donut" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Portfolio composition">
        <g transform="rotate(-90 60 60)" stroke-linecap="butt">${rings}</g>
        <text x="60" y="57" text-anchor="middle" font-size="10" fill="#6b7872">Total</text>
        <text x="60" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#14201c">TZS ${compact(total)}</text>
      </svg>
      <div class="dlegend">

          <span class="v">${compact(s.value)}</span><span class="p">${((s.value / total) * 100).toFixed(0)}%</span></div>`).join('')}
      </div>
    </div>`;
  }

  function bucketList() {

  }

    const max = Math.max(1, ...joins);
    const byBranch = BRANCHES.map((b) => {
      const rows = MEMBERS.filter((m) => m.branch === b);
      return { branch: b, count: rows.length, savings: sum(rows, (m) => m.savings), loans: sum(rows.filter((m) => m.loan), (m) => m.loan.outstanding) };
    }).filter((r) => r.count);
    const newThisMonth = joins[joins.length - 1];

    return `
      <section class="kpis">
        ${kpi(ICONS.members, 'green', 'Total members', num(p.members), '', `<span class="muted">${p.active} active</span>`)}
        ${kpi(ICONS.trend, 'blue', 'New this month', num(newThisMonth), '', `<span class="muted">October 2026</span>`)}
        ${kpi(ICONS.shield, 'gold', 'KYC pending', num(p.kycPending), '', `<span class="muted">awaiting documents</span>`)}
        ${kpi(ICONS.wallet, 'green', 'Member savings', 'TZS ' + compact(p.savings), '', `<span class="muted">across all branches</span>`)}
      </section>
      <div class="grid-2">
        <section class="panel">
          <div class="panel-head"><h2>New members</h2><span class="sub">last 6 months</span></div>
          <div class="chart">
            <div class="bars">
              ${months.map((k, i) => `<div class="bar-col"><div class="bar-pair"><div class="bar in" style="height:${Math.max(2, (joins[i] / max) * 100)}%" title="${joins[i]} joined"></div></div><div class="m">${monthLabel(k)}</div></div>`).join('')}
            </div>
            <div class="bar-axis"><span>0</span><span>${max} members</span></div>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>By branch</h2></div>
          <table><thead><tr><th>Branch</th><th class="num">Members</th><th class="num">Savings</th><th class="num">Loans</th></tr></thead>
          <tbody>${byBranch.map((b) => `<tr><td>${b.branch}</td><td class="num">${b.count}</td><td class="num money">${compact(b.savings)}</td><td class="num money">${compact(b.loans)}</td></tr>`).join('')}</tbody></table>
        </section>
      </div>`;
  }

  function loansTab(p) {
    const rows = loans().slice().sort((a, b) => b.loan.dpd - a.loan.dpd).slice(0, 5);
    return `
      <section class="kpis">
        ${kpi(ICONS.wallet, 'blue', 'Outstanding principal', 'TZS ' + compact(p.outstanding), '', `<span class="muted">${loans().length} active loans</span>`)}
        ${kpi(ICONS.alert, 'gold', 'Principal in arrears', 'TZS ' + compact(p.arrears), '', `<span class="muted">overdue installments</span>`)}
        ${kpi(ICONS.clientAlert, 'coral', 'Clients in arrears', num(p.clientsInArrears), '', `<span class="muted">${((p.clientsInArrears / Math.max(1, loans().length)) * 100).toFixed(0)}% of borrowers</span>`)}
        ${kpi(ICONS.shield, 'green', 'Portfolio at risk', p.par.toFixed(1) + '%', '', `<span class="muted">arrears ÷ principal</span>`)}
      </section>
      <div class="grid-2">
        <section class="panel">
          <div class="panel-head"><h2>Risk snapshot · PAR buckets</h2><span class="right">count · balance</span></div>
          ${bucketList()}
        </section>
        <section class="panel">
          <div class="panel-head"><h2>Oldest arrears</h2><span class="right">days past due</span></div>
          <table><thead><tr><th>Member</th><th>Loan</th><th class="num">Overdue</th><th class="num">DPD</th></tr></thead>
          <tbody>${rows.map((m) => `<tr class="clickable" onclick="location.hash='#/members/${m.id}'">
            <td>${m.first} ${m.last}</td><td class="muted">${m.loan.no}</td>
            <td class="num money">${num(m.loan.arrearsAmount)}</td>
            <td class="num">${m.loan.dpd}</td></tr>`).join('')}</tbody></table>
        </section>
      </div>`;
  }

  /* ---------------- member register ---------------- */
  function renderMembers() {
    const list = MEMBERS.filter((m) =>
      (state.branch === 'All branches' || m.branch === state.branch) &&
      (state.status === 'All statuses' || m.status === state.status) &&
      (!state.query || (m.first + ' ' + m.last + ' ' + m.id + ' ' + m.phone).toLowerCase().includes(state.query))
    );
    const pages = Math.max(1, Math.ceil(list.length / state.pageSize));
    if (state.page > pages) state.page = 1;
    const start = (state.page - 1) * state.pageSize;
    const rows = list.slice(start, start + state.pageSize);

    const body = rows.length ? rows.map((m) => `
      <tr class="clickable" onclick="location.hash='#/members/${m.id}'">
        <td><div class="member-cell"><div class="initials">${initials(m)}</div>
          <div><div class="nm">${m.first} ${m.last}</div><div class="no">${m.id} · ${m.membership}</div></div></div></td>
        <td class="muted">${m.phone}</td>
        <td class="muted">${m.branch}</td>
        <td class="num"><span class="money">${num(m.savings)}</span></td>
        <td class="num">${m.loan ? '<span class="money cr">' + num(m.loan.outstanding) + '</span>' : '<span class="muted">—</span>'}</td>
        <td>${kycPill(m.kyc)}</td>
        <td>${statusPill(m.status)}</td>
      </tr>`).join('') : '<tr><td colspan="7" class="empty">No member matches those filters.</td></tr>';

    $('#view').innerHTML = `
      <div class="page-head">
        <div><h1>Members</h1><p>${num(MEMBERS.length)} on the register · ${num(MEMBERS.filter((m) => m.status === 'Active').length)} active · synthetic data</p></div>
        <div class="right">
          <button class="btn" type="button" onclick="showToast('Prototype only', 'A member export is part of the reporting slice.')">Export</button>
          <button class="btn primary" type="button" onclick="showToast('Next slice', 'Member registration is the first screen I build for real: NIDA, phone, branch, group, KYC documents.')">New member</button>
        </div>
      </div>
      <section class="panel" aria-label="Member register">
        <div class="toolbar">
          <input type="search" placeholder="Search name, number or phone" aria-label="Search members" value="${state.query}" oninput="onSearch(this.value)" />
          <span style="flex:1"></span>
          <select aria-label="Branch" onchange="state.branch = this.value; state.page = 1; render()">
            ${['All branches'].concat(BRANCHES).map((b) => `<option ${state.branch === b ? 'selected' : ''}>${b}</option>`).join('')}
          </select>
          <select aria-label="Status" onchange="state.status = this.value; state.page = 1; render()">
            ${['All statuses', 'Active', 'Dormant'].map((s) => `<option ${state.status === s ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
        <table>
          <thead><tr><th>Member</th><th>Phone</th><th>Branch</th><th class="num">Savings (TZS)</th><th class="num">Loan balance</th><th>KYC</th><th>Status</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
        <div class="pager">
          <span>Showing ${list.length ? start + 1 : 0}–${Math.min(start + state.pageSize, list.length)} of ${num(list.length)}</span>
          <span class="right">
            <button class="btn small" ${state.page === 1 ? 'disabled' : ''} onclick="state.page--; render()">Previous</button>
            <span>Page ${state.page} of ${pages}</span>
            <button class="btn small" ${state.page === pages ? 'disabled' : ''} onclick="state.page++; render()">Next</button>
          </span>
        </div>
      </section>`;
  }

  let searchTimer;
  function onSearch(value) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.query = value.trim().toLowerCase(); state.page = 1; render(); }, 120);
  }

  /* ---------------- member profile ---------------- */
  function renderProfile(id) {
    const m = memberById(id);
    if (!m) { location.hash = '#/members'; return; }
    const tabs = [['savings', 'Savings'], ['shares', 'Shares'], ['loans', 'Loans'], ['ledger', 'Ledger']];
    const body = state.memberTab === 'savings' ? savingsTab(m)
      : state.memberTab === 'shares' ? sharesTab(m)
      : state.memberTab === 'loans' ? loansTabFor(m)
      : ledgerTab(m);

    $('#view').innerHTML = `
      <button class="back" type="button" onclick="location.hash='#/members'">← All members</button>
      <div class="identity">
        <div class="initials">${initials(m)}</div>
        <div>
          <h1>${m.first} ${m.last}</h1>
          <div class="meta"><span>${m.id}</span><span>${m.phone}</span><span>${m.branch}</span><span>Joined ${m.joined}</span></div>
          <div class="badges">${statusPill(m.status)} ${kycPill(m.kyc)} ${pill(m.membership, 'muted')}</div>
        </div>
        <div class="right">
          <button class="btn" type="button" onclick="showToast('Prototype only', 'Statements are part of the reporting slice.')">Statement</button>
          <button class="btn primary" type="button" onclick="openDeposit('${m.id}')">Deposit</button>
        </div>
      </div>
      <section class="stats">
        <div class="stat"><div class="k">Savings</div><div class="v">${num(m.savings)}</div><div class="s">${m.savingsNo}</div></div>
        <div class="stat"><div class="k">Shares</div><div class="v">${num(m.shares)}</div><div class="s">non-withdrawable</div></div>
        <div class="stat"><div class="k">Loan outstanding</div><div class="v">${m.loan ? num(m.loan.outstanding) : '—'}</div><div class="s">${m.loan ? m.loan.no + ' · ' + m.loan.product : 'no active loan'}</div></div>
        <div class="stat"><div class="k">Next repayment</div><div class="v" style="font-size:15px">${m.loan ? m.loan.nextDue : '—'}</div><div class="s">${m.loan ? num(m.loan.nextAmount) + ' due' : 'nothing scheduled'}</div></div>
      </section>
      <div class="tabs" role="tablist">
        ${tabs.map(([k, l]) => `<button role="tab" aria-selected="${state.memberTab === k}" class="${state.memberTab === k ? 'active' : ''}" onclick="setMemberTab('${k}')">${l}</button>`).join('')}
      </div>
      <div class="tab-body">${body}</div>`;
  }

  function setMemberTab(tab) { state.memberTab = tab; render(); }

  function savingsTab(m) {
    const rows = m.transactions.length ? m.transactions.map((t) => `
      <tr><td class="muted">${t.date}</td><td>${t.type}</td><td class="muted">${t.method}</td>
        <td class="num"><span class="money ${t.type === 'Deposit' ? 'dr' : 'cr'}">${t.type === 'Deposit' ? '+' : '−'}${num(t.amount)}</span></td>
        <td class="num"><span class="money">${num(t.balance)}</span></td><td class="muted">${t.ref}</td></tr>`).join('')
      : '<tr><td colspan="6" class="empty">No savings activity yet.</td></tr>';
    return `<div class="account-card">
        <div><div class="lbl">Savings balance</div><div class="big">${num(m.savings)}</div></div>
        <div class="meta">${m.savingsNo}<br />Opened ${m.joined}<br />TZS · whole shillings</div>
      </div>
      <table><thead><tr><th>Date</th><th>Type</th><th>Method</th><th class="num">Amount</th><th class="num">Balance</th><th>Receipt</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  function sharesTab(m) {
    return `<div class="account-card">
        <div><div class="lbl">Share capital</div><div class="big">${num(m.shares)}</div></div>
        <div class="meta">non-withdrawable · held as equity<br />account 3404 in the chart</div>
      </div>
      <div class="empty">Share purchases will post here once the Shares module is built.</div>`;
  }

  function loansTabFor(m) {
    if (!m.loan) return '<div class="empty">No loan on this member. Loan application is the slice after savings.</div>';
    const l = m.loan;
    return `<div class="account-card">
        <div><div class="lbl">Outstanding principal</div><div class="big">${num(l.outstanding)}</div></div>
        <div class="meta">${l.no} · ${l.product}<br />${l.rateLabel} · ${l.termLabel}<br />Disbursed ${l.disbursed}</div>
        <div class="meta" style="margin-left:0">${pill(l.status, l.status === 'Current' ? 'ok' : 'bad')}${l.dpd ? '<div style="margin-top:6px">' + l.dpd + ' days past due</div>' : ''}</div>
      </div>
      <div style="padding:14px 18px 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)">Installments ahead</div>
      <table><thead><tr><th>#</th><th>Due</th><th class="num">Principal</th><th class="num">Interest</th><th class="num">Total</th><th>Status</th></tr></thead>
      <tbody>${l.schedule.map((s) => `<tr><td class="muted">${s.n}</td><td>${s.due}</td>
        <td class="num"><span class="money">${num(s.principal)}</span></td>
        <td class="num"><span class="money">${num(s.interest)}</span></td>
        <td class="num"><span class="money">${num(s.total)}</span></td>
        <td>${pill(s.state, s.state === 'Overdue' ? 'bad' : 'muted')}</td></tr>`).join('')}</tbody></table>
      <div style="padding:16px 18px 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)">Recent repayments</div>
      <table><thead><tr><th>#</th><th>Due</th><th>Paid</th><th class="num">Amount</th><th>Status</th></tr></thead>
      <tbody>${l.paid.map((p) => `<tr><td class="muted">${p.n}</td><td>${p.due}</td><td class="muted">${p.paid}</td>
        <td class="num"><span class="money">${num(p.amount)}</span></td><td>${pill('Paid', 'ok')}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">No repayment yet.</td></tr>'}</tbody></table>`;
  }

  function ledgerTab(m) {
    const cashAccount = (method) => method === 'Bank' ? '1003 Bank – CRDB' : method === 'Mobile money' ? '1005 Mobile money float' : '1002 Cash on hand';
    const entries = m.transactions.slice(0, 4).map((t, i) => ({
      no: 'JE-' + (1240 - i * 3),
      date: t.date,
      event: t.type === 'Deposit' ? 'Savings deposit' : 'Savings withdrawal',
      lines: t.type === 'Deposit'
        ? [['Dr', cashAccount(t.method), t.amount], ['Cr', '2101 Member savings', t.amount]]
        : [['Dr', '2101 Member savings', t.amount], ['Cr', cashAccount(t.method), t.amount]],
    }));
    if (m.loan && m.loan.paid.length) {
      const p = m.loan.paid[0];
      entries.unshift({ no: 'JE-' + (1238 + m.loan.paid.length), date: p.paid, event: 'Loan repayment',
        lines: [['Dr', '1002 Cash on hand', p.amount], ['Cr', '1201 Loans receivable', p.amount - Math.round(p.amount * 0.18)], ['Cr', '4001 Interest income', Math.round(p.amount * 0.18)]] });
    }
    return `<div style="padding:11px 18px;background:#fbfcfc;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-faint)">
        Every operational action posts twice. This is the same member as the accountant sees them.</div>
      ${entries.map((e) => `<div style="padding:12px 18px;border-bottom:1px solid #f0f2f2">
        <div style="display:flex;gap:12px;align-items:baseline">
          <span class="money" style="font-size:11px;color:var(--ink-faint)">${e.no}</span>
          <span style="font-size:12.5px;font-weight:600">${e.event}</span>
          <span class="muted" style="font-size:11.5px;margin-left:auto">${e.date}</span>
        </div>
        <div style="margin-top:6px">
          ${e.lines.map((l) => `<div style="display:flex;gap:12px;padding:2px 0 2px 64px;font-size:12px">
            <span class="muted" style="width:20px">${l[0]}</span><span style="flex:1">${l[1]}</span>
            <span class="money ${l[0] === 'Dr' ? 'dr' : 'cr'}">${num(l[2])}</span></div>`).join('')}
        </div>
      </div>`).join('')}`;
  }

  /* ---------------- deposit ---------------- */
  function openDeposit(id) {
    const m = memberById(id);
    $('#modal-root').innerHTML = `
      <div class="overlay" onclick="if (event.target === this) closeModal()">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deposit-title">
          <header><h2 id="deposit-title">Deposit to savings</h2><p>${m.first} ${m.last} · ${m.savingsNo}</p></header>
          <div class="body">
            <div class="field"><label for="amount">Amount (TZS)</label>
              <input id="amount" type="number" min="1000" step="1000" value="100000" />
              <div class="chips">${[50000, 100000, 250000, 500000].map((v) => `<button type="button" onclick="document.getElementById('amount').value=${v}">${num(v)}</button>`).join('')}</div>
            </div>
            <div class="field"><label for="method">Method</label>
              <select id="method"><option>Cash</option><option>Bank</option><option>Mobile money</option></select>
            </div>
            <div class="field"><label for="ref">Reference</label><input id="ref" value="RCP-2431" /></div>
          </div>
          <footer><span class="hint">Posts Dr Cash / Cr Member savings</span>
            <div class="right"><button class="btn" type="button" onclick="closeModal()">Cancel</button>
            <button class="btn primary" type="button" onclick="postDeposit('${m.id}')">Post deposit</button></div></footer>
        </div>
      </div>`;
    setTimeout(() => document.getElementById('amount').select(), 20);
  }

  function closeModal() { $('#modal-root').innerHTML = ''; }

  function postDeposit(id) {
    const m = memberById(id);
    const amount = Number(document.getElementById('amount').value || 0);
    const method = document.getElementById('method').value;
    const ref = document.getElementById('ref').value || 'RCP-2431';
    if (!(amount >= 1000)) { alert('Enter at least 1,000.'); return; }
    m.savings += amount;
    m.transactions.unshift({ date: '2026-10-23', type: 'Deposit', method, amount, balance: m.savings, ref });
    closeModal();
    state.memberTab = 'savings';
    render();
    showToast('Deposit posted · JE-' + (1243 + m.transactions.length),
      num(amount) + ' TZS received from ' + m.first + ' ' + m.last + '. Receipt ' + ref + '.',
      'Dr 1002 Cash on hand ' + num(amount) + '  ·  Cr 2101 Member savings ' + num(amount));
  }

  function showToast(title, text, lines) {
    clearTimeout(state.toastTimer);
    $('#toast-root').innerHTML = `<div class="toast"><b>${title}</b><p>${text}</p>${lines ? '<div class="lines">' + lines + '</div>' : ''}</div>`;
    state.toastTimer = setTimeout(() => { $('#toast-root').innerHTML = ''; }, 6000);
  }

  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeMenu(); hideTip(); } });
  window.addEventListener('hashchange', () => {
    closeMenu();
    if (state.skipTrail) {
      state.skipTrail = false;
    } else {
      const hash = currentHash();
      if (state.trail[state.trailPos] !== hash) {
        state.trail = state.trail.slice(0, state.trailPos + 1);
        state.trail.push(hash);
        state.trailPos = state.trail.length - 1;
      }
    }
    state.memberTab = 'savings';
    state.page = 1;
    render();
    window.scrollTo(0, 0);
  });

  const navRootEl = document.getElementById('nav-root');
  navRootEl.addEventListener('pointerover', (e) => { const item = e.target.closest('.nav-item'); if (item) showTip(item); });
  navRootEl.addEventListener('pointerout', (e) => { const item = e.target.closest('.nav-item'); if (item && !item.contains(e.relatedTarget)) hideTip(); });
  navRootEl.addEventListener('scroll', hideTip, { passive: true });
  window.addEventListener('resize', hideTip);

  render();
  setRail(document.body.classList.contains('rail-collapsed'), false);
</script>
</body>
</html>
